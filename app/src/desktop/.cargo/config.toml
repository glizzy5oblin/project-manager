# Keep Rust build output out of the source tree: app/build/rust/
[build]
target-dir = "../../build/rust"

# TypeScript bindings generated by ts-rs (`cargo test` writes them) for the frontend.
[env]
TS_RS_EXPORT_DIR = { value = "../ui/lib/bindings", relative = true }

# Public client ID of Project Manager's GitHub OAuth app (device flow; not a secret, see docs/github.md).
# Baked in at build time; an PM_GITHUB_CLIENT_ID already in the environment overrides it.
PM_GITHUB_CLIENT_ID = "Ov23liz2huQkKgUBlKJd"
