[package]
name = "project-manager"
version = "0.0.1"
description = "Project Manager: git and GitHub manager for private and public project repos"
authors = []
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "project_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-log = "2"
thiserror = "2.0.21"
toml = "1.2.1"
toml_edit = "0.25.19"
semver = "1.0.28"
globset = "0.4.21"
gix = { version = "0.90.0", default-features = false, features = ["status", "revision", "sha1", "blame"] }
notify = "8.2.2"
ts-rs = "12.0.1"
tauri-plugin-dialog = "2"
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "json", "query", "rustls"] }
tauri-plugin-opener = "2"
similar = { version = "3.2.1", features = ["inline", "unicode"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
tempfile = "3.27.0"
